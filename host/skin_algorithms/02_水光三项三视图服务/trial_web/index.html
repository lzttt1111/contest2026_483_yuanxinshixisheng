<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水光三项 · BiSeNet试运行</title>
<style>body{font:16px system-ui;background:#f3f7f8;color:#173849;margin:24px}main{max-width:1350px;margin:auto}button,select{padding:10px 16px;margin:5px;border:1px solid #b7d1d3;border-radius:7px;background:white;color:#173849;cursor:pointer}.active{background:#087c7c;color:white}.notice{background:#fff0ca;padding:14px;border-radius:8px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}figure{margin:12px 0;background:white;border:1px solid #d4e2e5;border-radius:8px;padding:12px;text-align:center}img{width:100%;height:420px;object-fit:contain;cursor:zoom-in}table{width:100%;border-collapse:collapse;background:white}td,th{padding:12px;border:1px solid #d4e2e5;text-align:center}dialog{max-width:90vw}dialog img{height:auto;max-height:85vh;width:auto;max-width:85vw}small{color:#577582}@media(max-width:700px){.gallery{grid-template-columns:1fr}img{height:auto}}</style>
<main><h1>水光三项 · BiSeNet试运行</h1><p>真实执行：毛孔、可见色斑、表面油光。选定预处理已接入检测链。</p><p class="notice">本页为本机试运行，不是旧截图。三项检测已完成；下方评分为同图、同旧参考的诊断对照，分数越高状态越好；不是与新预处理匹配的正式标定结果。</p>
<label>验收照片 <select id="sample"><option value="one">第一组 one</option><option value="two">第二组 two</option></select></label>
<nav id="modules"><button data-value="pores" class="active">毛孔</button><button data-value="spots">可见色斑</button><button data-value="surface_gloss">表面油光</button></nav>
<nav id="kinds"><button data-value="detection" class="active">本次检测图</button><button data-value="new">本次BiSeNet有效皮肤</button><button data-value="old">修复前有效皮肤</button></nav>
<div id="gallery" class="gallery"></div><table><thead><tr><th>视图</th><th>本图检出数量</th><th>本图三项执行耗时</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table><p id="status"></p><small>各图独立计数，不跨照片相加。预处理绿色表示实际有效皮肤，不代表评分或疾病诊断。</small></main>
<section style="max-width:1350px;margin:24px auto"><h2>正面评分诊断对照 · 同一旧参考</h2><p class="notice">仅比较预处理变化，不表示皮肤发生变化，也不是正式新评分。区域中的左右按画面定义。</p><p id="scoreSummary"></p><table><thead><tr><th>评分区域</th><th>修复前分数</th><th>修复前程度</th><th>新预处理分数</th><th>新预处理程度</th></tr></thead><tbody id="scoreRows"></tbody></table><details><summary>全面部实测指标（用于核对）</summary><pre id="measurements"></pre></details></section><dialog id="zoom"><button id="close">关闭</button><img id="zoomImg" alt="放大结果"></dialog>
<script>const labels={left:'左侧',front:'正面',right:'右侧'},sample=document.getElementById('sample');let module='pores',kind='detection',generation=0;async function render(){let token=++generation;let response=await fetch('/api/state?sample='+sample.value+'&module='+module);if(!response.ok){document.getElementById('status').textContent='结果读取失败';return}let data=await response.json();if(token!==generation)return;let gallery=document.getElementById('gallery'),rows=document.getElementById('rows');gallery.replaceChildren();rows.replaceChildren();for(let v of data.views){let f=document.createElement('figure'),h=document.createElement('h3'),img=document.createElement('img');h.textContent=labels[v.view];img.src='/media/'+sample.value+'/'+v.view+'/'+kind+'/'+module;img.alt=labels[v.view]+' '+kind;img.onclick=()=>{document.getElementById('zoomImg').src=img.src;document.getElementById('zoom').showModal()};f.append(h,img);gallery.append(f);let tr=document.createElement('tr');for(let x of [labels[v.view],v.count??'不可用',v.seconds.toFixed(2)+' 秒',v.status]){let td=document.createElement('td');td.textContent=x;tr.append(td)}rows.append(tr)}document.getElementById('status').textContent=data.preprocessing+' · 已提供旧参考诊断对照（非正式新评分）'}for(let [id,set] of [['modules',v=>module=v],['kinds',v=>kind=v]])for(let b of document.querySelectorAll('#'+id+' button'))b.onclick=()=>{set(b.dataset.value);document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('active',x===b));render()};sample.onchange=render;document.getElementById('close').onclick=()=>document.getElementById('zoom').close();render();</script><script src="/comparison.js"></script></html>
