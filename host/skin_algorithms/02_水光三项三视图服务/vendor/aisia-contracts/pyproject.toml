[project]
name = "aisia-contracts"
version = "0.1.0"
description = "Shared pydantic contracts between dermavision worker and ai-skin-backend"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.12.0,<3.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisia_contracts"]
