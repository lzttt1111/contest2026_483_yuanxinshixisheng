[project]
name = "aisia-target-capture"
version = "0.0.1"
description = "PC baseline for device/contact detection, face pose, automatic capture, and face-region visualization"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "mediapipe==0.10.35",
    "numpy==2.2.6",
    "opencv-contrib-python==5.0.0.93",
    "pillow==12.3.0",
    "uvicorn==0.51.0",
]

[dependency-groups]
cpu = ["onnxruntime==1.23.2"]
cuda = ["onnxruntime-gpu[cuda,cudnn]==1.23.2"]

[tool.uv]
package = false
default-groups = ["cpu"]
index-url = "https://mirrors.aliyun.com/pypi/simple/"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

